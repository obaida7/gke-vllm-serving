# vllm-gke-deployment.yaml
# Production-grade manifest for deploying vLLM on GKE Autopilot with NVIDIA L4 GPU.
# Utilizes GCS Fuse CSI driver to mount the model weights bucket directly.

apiVersion: v1
kind: Namespace
metadata:
  name: kserve-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-serving-sa
  namespace: kserve-test
  annotations:
    # Link this KSA to the Google Service Account configured via gcp-setup.sh
    # Replace <PROJECT_ID> with your actual GCP Project ID
    iam.gke.io/gcp-service-account: gke-model-puller@project-24b1427f-85ff-418c-a1d.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-vllm
  namespace: kserve-test
  labels:
    app: qwen-vllm
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: qwen-vllm
  template:
    metadata:
      labels:
        app: qwen-vllm
      annotations:
        # Enable the GCS Fuse CSI sidecar container
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: vllm-serving-sa
      containers:
      - name: vllm-server
        image: vllm/vllm-openai:v0.4.3
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        # Load weights directly from GCS Fuse mount
        - "--model=/mnt/models/Qwen2.5-0.5B-Instruct"
        # Port for OpenAI-compatible API
        - "--port=8000"
        # Production engine optimizations
        - "--gpu-memory-utilization=0.90"
        - "--max-model-len=4096"
        - "--enable-prefix-caching" # Critical for conversational chat (reuses KV cache)
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8090
          name: metrics # vLLM Prometheus metrics port
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1" # Request 1 GPU (GKE Autopilot will assign an L4)
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: gcs-model-volume
          mountPath: /mnt/models
          readOnly: true
        - name: shm
          mountPath: /dev/shm
      nodeSelector:
        # Request NVIDIA L4 GPU specifically
        cloud.google.com/gke-accelerator: nvidia-l4
      volumes:
      - name: gcs-model-volume
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            # Replace <BUCKET_NAME> with your actual GCS bucket (e.g. your-project-id-ml-model-registry)
            bucketName: project-24b1427f-85ff-418c-a1d-ml-model-registry
            mountOptions: "implicit-dirs"
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-vllm-service
  namespace: kserve-test
  labels:
    app: qwen-vllm
spec:
  type: ClusterIP
  selector:
    app: qwen-vllm
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: metrics
    port: 8090
    targetPort: 8090

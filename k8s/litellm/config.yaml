apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: kserve-test
data:
  config.yaml: |
    model_list:
      - model_name: qwen
        litellm_params:
          model: openai/qwen
          api_base: http://qwen-vllm.kserve-test.svc.cluster.local:80
          api_key: "dummy-key-for-local-vllm"
    
    litellm_settings:
      drop_params: true
      success_callback: ["otel"]
      failure_callback: ["otel"]
